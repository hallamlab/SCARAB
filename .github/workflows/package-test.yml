name: Package and reviewer tests
on:
  pull_request:
  push:
    branches: [refactor, main, 'docs/user-guide']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: Install and test
        shell: bash -el {0}
        run: |
          python -m pip install --no-deps --no-build-isolation .
          python scripts/render_packaging.py --check
          python -m unittest discover -s tests -p 'test_*.py'
          python tests/reassembly_smoke.py
          scarab info
          scarab recruit --help
      - name: Run the bundled recruitment and reassembly demo
        shell: bash -el {0}
        run: |
          python scripts/prepare_reviewer.py --output "$RUNNER_TEMP/scarab-reviewer"
          cd "$RUNNER_TEMP/scarab-reviewer/demo"
          scarab recruit -m k12.gold_assembly.fasta -l read_list.txt -s SAG -o SCARAB_out -t 2
          scarab reassemble -i SCARAB_out/algo_defaults/Default/xpgs/ecoli-COLI-K12.3578.intersect.xPG.fasta -l read_list.txt -o reassembly -t 2 --memory 4
          python "$GITHUB_WORKSPACE/scripts/validate_reviewer.py" --dataset . --output SCARAB_out --reassembly reassembly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewer-logs
          path: |
            ${{ runner.temp }}/scarab-reviewer/demo/SCARAB_out/SCARAB_log.txt
            ${{ runner.temp }}/scarab-reviewer/demo/SCARAB_out/scarab_*.json
            ${{ runner.temp }}/scarab-reviewer/demo/reassembly/scarab_*.json
            ${{ runner.temp }}/scarab-reviewer/demo/reassembly/reassembly_summary.tsv
            ${{ runner.temp }}/scarab-reviewer/demo/reassembly/*/reassembly.json
            ${{ runner.temp }}/scarab-reviewer/demo/reassembly/*/logs/**
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r docs/requirements.txt
      - run: python -m sphinx -W --keep-going -b html docs _build/html
