name: Check Anaconda credential (no upload)
on:
  workflow_dispatch:
  push:
    branches: ['docs/user-guide']
    paths:
      - '.github/workflows/check-anaconda.yml'
      - 'scripts/check_anaconda.py'
permissions:
  contents: read
jobs:
  authenticate:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify token and organization access without uploading
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
          ANACONDA_OWNER: ${{ vars.ANACONDA_OWNER || 'hallamlab' }}
        run: python3 scripts/check_anaconda.py
