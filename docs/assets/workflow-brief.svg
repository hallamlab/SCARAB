<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1450" viewBox="0 0 1720 1450" role="img" aria-labelledby="title desc">
<title id="title">SCARAB complete software workflow</title>
<desc id="desc">Numbered conceptual modules with inputs, computational steps, data products and optional branches. See the workflow guide for source-code references and execution order.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#111111"/></marker></defs>
<g font-family="Times New Roman, Times, serif" fill="#111111">
<rect x="20" y="20" width="1680" height="78" rx="16" fill="#CCCCCC" stroke="#666666" stroke-width="1.5"/>
<text x="860" y="53" font-size="28" text-anchor="middle">SCARAB Python controller • Local command or one Slurm job</text>
<text x="860" y="82" font-size="20" text-anchor="middle">Input validation • Output lock and provenance • Tool threads and worker pools • Reuse of matching completed runs</text>
<rect x="20" y="120" width="975" height="130" rx="16" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5"/>
<text x="45" y="151" font-size="28" text-anchor="start">Inputs</text>
<text x="45" y="187" font-size="21" text-anchor="start">Assembly FASTA + read-library list (paired FASTQs or supported single-file reads)</text>
<text x="45" y="216" font-size="21" text-anchor="start">Optional: trusted genome/scaffold FASTAs for anchored recruitment</text>
<rect x="1030" y="120" width="670" height="110" rx="16" fill="#CCCCCC" stroke="#666666" stroke-width="1.5"/>
<text x="1090" y="152" font-size="21" text-anchor="middle">Module</text>
<rect x="1078" y="177" width="24" height="24" rx="0" fill="#F5F5F5" stroke="#111111" stroke-width="1.5"/>
<text x="1220" y="152" font-size="21" text-anchor="middle">Compute</text>
<path d="M1207 189 L1220 176 L1233 189 L1220 202 Z" fill="#f5f5f5" stroke="#666666" stroke-width="3"/>
<text x="1350" y="152" font-size="21" text-anchor="middle">Data</text>
<circle cx="1350" cy="189" r="12" fill="#F5F5F5" stroke="#666666" stroke-width="3"/>
<text x="1480" y="152" font-size="21" text-anchor="middle">Input</text>
<circle cx="1480" cy="189" r="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3"/>
<text x="1610" y="152" font-size="21" text-anchor="middle">Output</text>
<circle cx="1610" cy="189" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="160" y="355.0" font-size="27" text-anchor="middle">Prepare sequence</text>
<text x="160" y="385.0" font-size="27" text-anchor="middle">anchors</text>
<rect x="313" y="357.0" width="26" height="26" rx="0" fill="#F5F5F5" stroke="#111111" stroke-width="1.5"/>
<text x="326" y="377.0" font-size="20" text-anchor="middle">1</text>
<path d="M339 370.0 L448 370.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="460.0" cy="370.0" r="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3"/>
<text x="460.0" y="320.0" font-size="22" text-anchor="middle">Assembly + optional</text>
<text x="460.0" y="345.0" font-size="22" text-anchor="middle">trusted genomes</text>
<path d="M813.6666666666667 370.0 L826.6666666666667 357.0 L839.6666666666667 370.0 L826.6666666666667 383.0 Z" fill="#f5f5f5" stroke="#666666" stroke-width="3"/>
<text x="826.6666666666667" y="320.0" font-size="22" text-anchor="middle">Filter contigs;</text>
<text x="826.6666666666667" y="345.0" font-size="22" text-anchor="middle">create sequence windows</text>
<text x="826.6666666666667" y="407.0" font-size="18" text-anchor="middle">SCARAB</text>
<path d="M1180.3333333333335 370.0 L1193.3333333333335 357.0 L1206.3333333333335 370.0 L1193.3333333333335 383.0 Z" fill="#f5f5f5" stroke="#666666" stroke-width="3"/>
<text x="1193.3333333333335" y="320.0" font-size="22" text-anchor="middle">MinHash search;</text>
<text x="1193.3333333333335" y="345.0" font-size="22" text-anchor="middle">select trusted anchors</text>
<text x="1193.3333333333335" y="407.0" font-size="18" text-anchor="middle">sourmash</text>
<circle cx="1560.0" cy="370.0" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="1560.0" y="320.0" font-size="22" text-anchor="middle">Windows, candidate hits</text>
<text x="1560.0" y="345.0" font-size="22" text-anchor="middle">and reference anchors</text>
<path d="M473.0 370.0 L813.6666666666667 370.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M839.6666666666667 370.0 L1180.3333333333335 370.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1206.3333333333335 370.0 L1547.0 370.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M326 384.0 L326 546.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="160" y="560.0" font-size="27" text-anchor="middle">Build feature views</text>
<rect x="313" y="547.0" width="26" height="26" rx="0" fill="#F5F5F5" stroke="#111111" stroke-width="1.5"/>
<text x="326" y="567.0" font-size="20" text-anchor="middle">2</text>
<path d="M339 560.0 L448 560.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="460.0" cy="560.0" r="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3"/>
<text x="460.0" y="510.0" font-size="22" text-anchor="middle">Assembly windows +</text>
<text x="460.0" y="535.0" font-size="22" text-anchor="middle">read libraries</text>
<path d="M813.6666666666667 560.0 L826.6666666666667 547.0 L839.6666666666667 560.0 L826.6666666666667 573.0 Z" fill="#f5f5f5" stroke="#666666" stroke-width="3"/>
<text x="826.6666666666667" y="510.0" font-size="22" text-anchor="middle">Map reads; summarize</text>
<text x="826.6666666666667" y="535.0" font-size="22" text-anchor="middle">and scale coverage</text>
<text x="826.6666666666667" y="597.0" font-size="18" text-anchor="middle">minimap2 / SAMtools</text>
<path d="M1180.3333333333335 560.0 L1193.3333333333335 547.0 L1206.3333333333335 560.0 L1193.3333333333335 573.0 Z" fill="#f5f5f5" stroke="#666666" stroke-width="3"/>
<text x="1193.3333333333335" y="510.0" font-size="22" text-anchor="middle">Count tetranucleotides;</text>
<text x="1193.3333333333335" y="535.0" font-size="22" text-anchor="middle">transform and scale</text>
<text x="1193.3333333333335" y="597.0" font-size="18" text-anchor="middle">scikit-bio / scikit-learn</text>
<circle cx="1560.0" cy="560.0" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="1560.0" y="510.0" font-size="22" text-anchor="middle">Abundance and</text>
<text x="1560.0" y="535.0" font-size="22" text-anchor="middle">composition matrices</text>
<path d="M473.0 560.0 L813.6666666666667 560.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M839.6666666666667 560.0 L1180.3333333333335 560.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1206.3333333333335 560.0 L1547.0 560.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M326 574.0 L326 736.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="160" y="750.0" font-size="27" text-anchor="middle">Select and embed</text>
<rect x="313" y="737.0" width="26" height="26" rx="0" fill="#F5F5F5" stroke="#111111" stroke-width="1.5"/>
<text x="326" y="757.0" font-size="20" text-anchor="middle">3</text>
<path d="M339 750.0 L448 750.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="460.0" cy="750.0" r="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3"/>
<text x="460.0" y="700.0" font-size="22" text-anchor="middle">Features + bundled</text>
<text x="460.0" y="725.0" font-size="22" text-anchor="middle">reference profiles</text>
<path d="M813.6666666666667 750.0 L826.6666666666667 737.0 L839.6666666666667 750.0 L826.6666666666667 763.0 Z" fill="#f5f5f5" stroke="#666666" stroke-width="3"/>
<text x="826.6666666666667" y="700.0" font-size="22" text-anchor="middle">Resolve AutoOpt settings</text>
<text x="826.6666666666667" y="725.0" font-size="22" text-anchor="middle">and explicit overrides</text>
<text x="826.6666666666667" y="787.0" font-size="18" text-anchor="middle">SCARAB / NumPy</text>
<path d="M1180.3333333333335 750.0 L1193.3333333333335 737.0 L1206.3333333333335 750.0 L1193.3333333333335 763.0 Z" fill="#f5f5f5" stroke="#666666" stroke-width="3"/>
<text x="1193.3333333333335" y="700.0" font-size="22" text-anchor="middle">Embed feature views;</text>
<text x="1193.3333333333335" y="725.0" font-size="22" text-anchor="middle">join by window ID</text>
<text x="1193.3333333333335" y="787.0" font-size="18" text-anchor="middle">UMAP</text>
<circle cx="1560.0" cy="750.0" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="1560.0" y="700.0" font-size="22" text-anchor="middle">Shared embedding</text>
<text x="1560.0" y="725.0" font-size="22" text-anchor="middle">and effective parameters</text>
<path d="M473.0 750.0 L813.6666666666667 750.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M839.6666666666667 750.0 L1180.3333333333335 750.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1206.3333333333335 750.0 L1547.0 750.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
