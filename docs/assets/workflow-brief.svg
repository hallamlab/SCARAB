<rect x="313" y="927.0" width="26" height="26" rx="0" fill="#F5F5F5" stroke="#111111" stroke-width="1.5"/>
<text x="326" y="947.0" font-size="20" text-anchor="middle">4</text>
<path d="M339 940.0 L448 940.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="460.0" cy="940.0" r="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3"/>
