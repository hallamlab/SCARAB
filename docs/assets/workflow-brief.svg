<text x="460.0" y="915.0" font-size="22" text-anchor="middle">available anchors</text>
<path d="M813.6666666666667 940.0 L826.6666666666667 927.0 L839.6666666666667 940.0 L826.6666666666667 953.0 Z" fill="#f5f5f5" stroke="#666666" stroke-width="3"/>
<text x="826.6666666666667" y="890.0" font-size="22" text-anchor="middle">De novo / anchored</text>
<text x="826.6666666666667" y="915.0" font-size="22" text-anchor="middle">density clustering</text>
<text x="826.6666666666667" y="977.0" font-size="18" text-anchor="middle">HDBSCAN</text>
<path d="M1180.3333333333335 940.0 L1193.3333333333335 927.0 L1206.3333333333335 940.0 L1193.3333333333335 953.0 Z" fill="#f5f5f5" stroke="#666666" stroke-width="3"/>
<text x="1193.3333333333335" y="890.0" font-size="22" text-anchor="middle">Anchor-trained inliers;</text>
<text x="1193.3333333333335" y="915.0" font-size="22" text-anchor="middle">resolve contig support</text>
<text x="1193.3333333333335" y="977.0" font-size="18" text-anchor="middle">scikit-learn</text>
<circle cx="1560.0" cy="940.0" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="1560.0" y="890.0" font-size="22" text-anchor="middle">De novo bins and</text>
<text x="1560.0" y="915.0" font-size="22" text-anchor="middle">anchored assignments</text>
<path d="M473.0 940.0 L813.6666666666667 940.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M839.6666666666667 940.0 L1180.3333333333335 940.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1206.3333333333335 940.0 L1547.0 940.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M326 954.0 L326 1116.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
