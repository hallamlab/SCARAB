<rect x="313" y="1117.0" width="26" height="26" rx="0" fill="#F5F5F5" stroke="#111111" stroke-width="1.5"/>
<text x="326" y="1137.0" font-size="20" text-anchor="middle">5</text>
<path d="M339 1130.0 L448 1130.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="460.0" cy="1130.0" r="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3"/>
<text x="460.0" y="1080.0" font-size="22" text-anchor="middle">MinHash, HDBSCAN</text>
<text x="460.0" y="1105.0" font-size="22" text-anchor="middle">and OC-SVM evidence</text>
<path d="M813.6666666666667 1130.0 L826.6666666666667 1117.0 L839.6666666666667 1130.0 L826.6666666666667 1143.0 Z" fill="#f5f5f5" stroke="#666666" stroke-width="3"/>
<text x="826.6666666666667" y="1080.0" font-size="22" text-anchor="middle">Union pairwise agreements;</text>
<text x="826.6666666666667" y="1105.0" font-size="22" text-anchor="middle">retain trusted anchors</text>
<text x="826.6666666666667" y="1167.0" font-size="18" text-anchor="middle">SCARAB</text>
<path d="M1180.3333333333335 1130.0 L1193.3333333333335 1117.0 L1206.3333333333335 1130.0 L1193.3333333333335 1143.0 Z" fill="#f5f5f5" stroke="#666666" stroke-width="3"/>
<text x="1193.3333333333335" y="1080.0" font-size="22" text-anchor="middle">Recover contigs; add trusted</text>
<text x="1193.3333333333335" y="1105.0" font-size="22" text-anchor="middle">sequence and deduplicate</text>
<text x="1193.3333333333335" y="1167.0" font-size="18" text-anchor="middle">BBTools</text>
<circle cx="1560.0" cy="1130.0" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="1560.0" y="1055.0" font-size="22" text-anchor="middle">Recruitment tables, bins and</text>
<text x="1560.0" y="1080.0" font-size="22" text-anchor="middle">extended population-genomes</text>
<text x="1560.0" y="1105.0" font-size="22" text-anchor="middle">(xPGs)</text>
<path d="M473.0 1130.0 L813.6666666666667 1130.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M839.6666666666667 1130.0 L1180.3333333333335 1130.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1206.3333333333335 1130.0 L1547.0 1130.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M326 1144.0 L326 1306.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="160" y="1305.0" font-size="27" text-anchor="middle">Guided reassembly</text>
<text x="160" y="1335.0" font-size="27" text-anchor="middle">(optional)</text>
<rect x="313" y="1307.0" width="26" height="26" rx="0" fill="#F5F5F5" stroke="#111111" stroke-width="1.5"/>
<text x="326" y="1327.0" font-size="20" text-anchor="middle">6</text>
<path d="M339 1320.0 L448 1320.0" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="460.0" cy="1320.0" r="12" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3"/>
<text x="460.0" y="1270.0" font-size="22" text-anchor="middle">xPGs +</text>
<text x="460.0" y="1295.0" font-size="22" text-anchor="middle">paired short reads</text>
<path d="M813.6666666666667 1320.0 L826.6666666666667 1307.0 L839.6666666666667 1320.0 L826.6666666666667 1333.0 Z" fill="#f5f5f5" stroke="#666666" stroke-width="3"/>
<text x="826.6666666666667" y="1270.0" font-size="22" text-anchor="middle">Map and select pairs;</text>
<text x="826.6666666666667" y="1295.0" font-size="22" text-anchor="middle">repair and trim</text>
<text x="826.6666666666667" y="1357.0" font-size="18" text-anchor="middle">minimap2 / BBTools</text>
<path d="M1180.3333333333335 1320.0 L1193.3333333333335 1307.0 L1206.3333333333335 1320.0 L1193.3333333333335 1333.0 Z" fill="#f5f5f5" stroke="#666666" stroke-width="3"/>
<text x="1193.3333333333335" y="1270.0" font-size="22" text-anchor="middle">Assemble using</text>
<text x="1193.3333333333335" y="1295.0" font-size="22" text-anchor="middle">trusted contigs</text>
<text x="1193.3333333333335" y="1357.0" font-size="18" text-anchor="middle">SPAdes</text>
<circle cx="1560.0" cy="1320.0" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="1560.0" y="1270.0" font-size="22" text-anchor="middle">Contigs, scaffolds,</text>
<text x="1560.0" y="1295.0" font-size="22" text-anchor="middle">summary and logs</text>
